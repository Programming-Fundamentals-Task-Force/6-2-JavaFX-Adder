name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
env:
  PROJECT_DIR: ''
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Find project directory
      id: find-dir
      run: |
        # Find the first directory matching 'lab*' or 'hw*'
        PROJECT_DIR=$(find . -maxdepth 1 -type d \( -name "lab*" -o -name "hw*" \) | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          echo "No matching directory found!" >&2
          exit 1
        fi
        echo "PROJECT_DIR=${PROJECT_DIR}" >> $GITHUB_ENV
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: app_window_has_correct_size
      id: unit-test-1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: app_window_has_correct_size
        setup-command: ''
        command: "./gradle-tests/gradlew test --tests org.test.AppTest.app_window_has_correct_size -p gradle-tests"
        timeout: 10
        max-score: 15
    - name: app_has_two_textfields
      id: unit-test-2
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: app_has_two_textfields
        setup-command: ''
        command: "./gradle-tests/gradlew test --tests org.test.AppTest.app_has_two_textfields -p gradle-tests"
        timeout: 10
        max-score: 15
    - name: app_has_add_button
      id: unit-test-3
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: app_has_add_button
        setup-command: ''
        command: "./gradle-tests/gradlew test --tests org.test.AppTest.app_has_add_button -p gradle-tests"
        timeout: 10
        max-score: 15
    - name: app_has_correct_text_labels
      id: unit-test-4
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: app_has_correct_text_labels
        setup-command: ''
        command: "./gradle-tests/gradlew test --tests org.test.AppTest.app_has_correct_text_labels -p gradle-tests"
        timeout: 10
        max-score: 15
    - name: all_controls_are_roughly_centered
      id: unit-test-5
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: all_controls_are_roughly_centered
        setup-command: ''
        command: "./gradle-tests/gradlew test --tests org.test.AppTest.all_controls_are_roughly_centered -p gradle-tests"
        timeout: 10
        max-score: 15
    - name: add_two_numbers_from_textfields_when_clicked
      id: unit-test-6
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: add_two_numbers_from_textfields_when_clicked
        setup-command: ''
        command: "./gradle-tests/gradlew test --tests org.test.AppTest.add_two_numbers_from_textfields_when_clicked -p gradle-tests"
        timeout: 10
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        UNIT-TEST-1_RESULTS: "${{ steps.unit-test-1.outputs.result }}"
        UNIT-TEST-2_RESULTS: "${{ steps.unit-test-2.outputs.result }}"
        UNIT-TEST-3_RESULTS: "${{ steps.unit-test-3.outputs.result }}"
        UNIT-TEST-4_RESULTS: "${{ steps.unit-test-4.outputs.result }}"
        UNIT-TEST-5_RESULTS: "${{ steps.unit-test-5.outputs.result }}"
        UNIT-TEST-6_RESULTS: "${{ steps.unit-test-6.outputs.result }}"
      with:
        runners: unit-test-1,unit-test-2,unit-test-3,unit-test-4,unit-test-5,unit-test-6
